let active=false,finished=false,remaining=2700,interval;
function start(){if(!nama.value.trim()||!kelas.value.trim()||!absen.value.trim()){alert("Lengkapi nama, kelas, dan nomor absen.");return}
intro.style.display="none";quiz.style.display="block";active=true;ident.textContent=`${nama.value} • ${kelas.value} • Absen ${absen.value}`;render();interval=setInterval(()=>{remaining--;updateTimer();if(remaining<=0)finish(true)},1000)}
function render(){questions.innerHTML=Q.map((q,i)=>`<section class="q"><h3>${i+1}. ${q[0]}</h3>${q[1].map((a,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}"><span style="color:#111">${String.fromCharCode(65+j)}. ${a}</span></label>`).join("")}</section>`).join("")}
function updateTimer(){let m=Math.floor(remaining/60),s=remaining%60;timer.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function finish(auto){if(finished)return;finished=true;active=false;clearInterval(interval);let correct=0;Q.forEach((q,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);if(v&&Number(v.value)===q[2])correct++});let value=Math.round(10+(correct/20)*90);quiz.style.display="none";result.style.display="block";resultIdentity.textContent=`${nama.value} • ${kelas.value} • Absen ${absen.value}`;score.textContent=`Nilai: ${value}/100`;msg.textContent=auto?"Kuis ditutup (waktu habis atau pelanggaran tab/jendela).":"Jawaban berhasil dikumpulkan.";document.querySelectorAll("input").forEach(x=>x.disabled=true)}
document.addEventListener("visibilitychange",()=>{if(active&&document.hidden)finish(true)});window.addEventListener("blur",()=>{if(active)finish(true)});
document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("copy",e=>e.preventDefault());document.addEventListener("paste",e=>e.preventDefault());document.addEventListener("keydown",e=>{if(active&&(e.ctrlKey||e.metaKey)&&["t","w","n","r"].includes(e.key.toLowerCase()))e.preventDefault()});
</script></body></html>
